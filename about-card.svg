<svg viewBox="0 0 340 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c34"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b7dff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#9b59ff"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="340" height="460" fill="url(#bgGlow)" rx="16"/>

  <!-- fixed anchor / hook -->
  <circle cx="170" cy="18" r="6" fill="#3a3a5a"/>
  <rect x="164" y="10" width="12" height="16" rx="6" fill="#3a3a5a"/>

  <!-- swinging group: strap + card -->
  <g id="swing">
    <!-- lanyard strap -->
    <path d="M 170 20 L 155 120 L 185 120 Z" fill="url(#strapGrad)" opacity="0.9"/>
    <rect x="158" y="112" width="24" height="14" rx="3" fill="url(#strapGrad)"/>

    <!-- metal clip -->
    <rect x="163" y="122" width="14" height="18" rx="4" fill="#8a8aa5"/>
    <circle cx="170" cy="131" r="3" fill="#141428"/>

    <!-- card -->
    <g filter="url(#softShadow)">
      <rect x="60" y="140" width="220" height="290" rx="18" fill="url(#cardGrad)" stroke="#6c63ff" stroke-opacity="0.4" stroke-width="1.5"/>

      <!-- header strip -->
      <path d="M 60 158 Q 60 140 78 140 L 262 140 Q 280 140 280 158 L 280 190 L 60 190 Z" fill="url(#headerGrad)"/>
      <circle cx="170" cy="150" r="4" fill="#ffffff" opacity="0.5"/>

      <!-- punch hole -->
      <circle cx="170" cy="150" r="5" fill="#141428"/>

      <!-- avatar circle -->
      <circle cx="170" cy="235" r="46" fill="#141428" stroke="#6c63ff" stroke-width="2.5" filter="url(#glow)"/>
      <text x="170" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#9b8dff" text-anchor="middle" font-weight="bold">AB</text>

      <!-- name -->
      <text x="170" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">Adeeba Bibi</text>

      <!-- role -->
      <text x="170" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a9a9c9" text-anchor="middle">AI / ML &amp; Generative AI Engineer</text>

      <!-- divider -->
      <line x1="90" y1="345" x2="250" y2="345" stroke="#6c63ff" stroke-opacity="0.25" stroke-width="1"/>

      <!-- status pill -->
      <rect x="100" y="360" width="140" height="26" rx="13" fill="#6c63ff" fill-opacity="0.15" stroke="#6c63ff" stroke-opacity="0.5"/>
      <circle cx="118" cy="373" r="4" fill="#4ade80"/>
      <text x="184" y="377" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c9c9e8" text-anchor="middle">Diving into Research 🔬</text>

      <!-- footer id -->
      <text x="170" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6a6a8a" text-anchor="middle" letter-spacing="1.5">FINAL YEAR &#183; BSCS &#183; 2027</text>
    </g>

    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-4 170 20; 4 170 20; -4 170 20"
      dur="4.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>
</svg>
